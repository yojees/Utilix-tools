    <script>
      (function () {
        try {
          var _rawFetch = window.fetch;
          var _activeFetch = typeof _rawFetch === 'function' ? _rawFetch.bind(window) : _rawFetch;
          Object.defineProperty(window, 'fetch', {
            get: function () {
              return _activeFetch;
            },
            set: function (fn) {
              _activeFetch = fn;
            },
            configurable: true,
            enumerable: true,
          });
        } catch (e) {
          // Ignore if environment forbids redefinition
        }
      })();
    </script>
